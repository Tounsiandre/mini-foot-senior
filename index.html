<div id="prog" aria-hidden="true"></div>

<header>
  <div class="wrap bar">
    <a class="brand" href="#top"><img src="logo.png" alt=""><span data-i18n="brand"></span></a>
    <nav aria-label="Navigation">
      <a href="#pack" data-i18n="nav_pack"></a>
      <a href="#photos" data-i18n="nav_photos"></a>
      <a href="#offre" data-i18n="nav_offer"></a>
      <a href="#comment" data-i18n="nav_how"></a>
      <a href="#faq" data-i18n="nav_faq"></a>
      <a href="#contact" data-i18n="nav_contact"></a>
    </nav>
    <a class="acct" href="connexion.html" data-i18n-aria="nav_login" data-go-skip><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></a>
    <div class="lang" role="group" aria-label="Langue / اللغة">
      <button type="button" data-lang="fr" aria-pressed="true">FR</button>
      <button type="button" data-lang="ar" aria-pressed="false">العربية</button>
    </div>
    <a class="btn btn-gold" href="inscription.html" data-go="header" data-i18n="cta_join"></a>
  </div>
</header>

<main id="top">
<section class="hero" style="padding:0">
  <div class="wrap hero-grid">
    <div>
      <span class="kicker"><i></i><span data-i18n="kicker"></span></span>
      <h1><span data-i18n="h1a"></span> <em data-i18n="h1b"></em></h1>
      <p class="lead" data-i18n="lead"></p>
      <div class="cta-row">
        <a class="btn btn-gold" href="inscription.html" data-go="hero" data-i18n="cta_book"></a>
        <a class="btn btn-line" href="#offre" data-i18n="cta_offer"></a>
      </div>
      <div class="ages"><b>30–65</b><span data-i18n="ages_line"></span></div>
    </div>
    <div class="photo">
      <video id="hvid" src="promo.mp4" poster="promo-poster.jpg" autoplay muted loop playsinline preload="auto"></video>
      <button class="hsnd" id="hsnd" type="button" data-i18n-aria="snd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4V5z" fill="currentColor"/><g id="hs-on" style="display:none"><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></g><g id="hs-off"><path d="M16 9l6 6M22 9l-6 6"/></g></svg></button>
      <div class="tag"><div class="row"><span class="n" data-count="290">290</span><span class="u"><span data-i18n="cur"></span><br><span data-i18n="permonth"></span></span></div></div>
    </div>
  </div>
</section>

<div class="strip">
  <div class="wrap">
    <div class="s"><span class="big" data-count="4">4</span><span class="lbl" data-i18n="s1"></span></div>
    <div class="s"><span class="big">30–65</span><span class="lbl" data-i18n="s2"></span></div>
    <div class="s"><span class="big">1<sup style="font-size:.5em" data-i18n="s3sup"></sup></span><span class="lbl" data-i18n="s3"></span></div>
  </div>
</div>

<div class="marq" aria-hidden="true"><div class="marq-track" id="marq"></div></div>

<section id="pack">
  <div class="wrap">
    <div class="head">
      <span class="eyebrow" data-i18n="pack_eyebrow"></span>
      <h2 data-i18n="pack_title"></h2>
      <p data-i18n="pack_sub"></p>
    </div>
    <div class="cards">
      <div class="card">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></div>
        <h3 data-i18n="c1t"></h3><p data-i18n="c1p"></p>
      </div>
      <div class="card">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg></div>
        <h3 data-i18n="c2t"></h3><p data-i18n="c2p"></p>
      </div>
      <div class="card">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/></svg></div>
        <h3 data-i18n="c3t"></h3><p data-i18n="c3p"></p>
      </div>
    </div>
  </div>
</section>

<section class="bg-paper" id="pour-qui">
  <div class="wrap who">
    <div>
      <div class="age-big">30<span>–</span>65<small data-i18n="who_small"></small></div>
    </div>
    <div>
      <span class="eyebrow" data-i18n="who_eyebrow"></span>
      <h2 data-i18n="who_title"></h2>
      <p style="margin:16px 0 24px;color:var(--muted);font-size:1.08rem" data-i18n="who_p"></p>
      <ul>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg><span data-i18n="w1"></span></li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg><span data-i18n="w2"></span></li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg><span data-i18n="w3"></span></li>
      </ul>
    </div>
  </div>
</section>

<section class="dark" id="video">
  <div class="wrap vid">
    <div class="phone" id="phone">
      <video id="promo" src="promo.mp4" poster="promo-poster.jpg" playsinline preload="metadata"></video>
      <button class="play" id="playbtn" type="button" data-i18n-aria="vid_play"><span><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg></span></button>
    </div>
    <div class="txt">
      <span class="eyebrow" data-i18n="vid_eyebrow"></span>
      <h2 data-i18n="vid_title"></h2>
      <p data-i18n="vid_p"></p>
      <a class="btn btn-gold" href="inscription.html" data-go="video" data-i18n="vid_cta"></a>
    </div>
  </div>
</section>

<section class="bg-paper" id="photos">
  <div class="wrap">
    <div class="ph-top">
      <div class="head">
        <span class="eyebrow" data-i18n="ph_eyebrow"></span>
        <h2 data-i18n="ph_title"></h2>
        <p data-i18n="ph_p"></p>
      </div>
      <div class="gnav">
        <button type="button" id="gprev" data-i18n-aria="lb_p"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button type="button" id="gnext" data-i18n-aria="lb_n"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
    </div>
    <div class="gal" id="gal">
      <button type="button"><img src="p1.jpg" width="1280" height="853" loading="lazy" data-i18n-alt="ph_alt" alt=""></button>
      <button type="button"><img src="p2.jpg" width="853" height="1280" loading="lazy" data-i18n-alt="ph_alt" alt=""></button>
      <button type="button"><img src="p4.jpg" width="853" height="1280" loading="lazy" data-i18n-alt="ph_alt" alt=""></button>
      <button type="button"><img src="p3.jpg" width="1280" height="853" loading="lazy" data-i18n-alt="ph_alt" alt=""></button>
      <button type="button"><img src="p5.jpg" width="853" height="1280" loading="lazy" data-i18n-alt="ph_alt" alt=""></button>
      <button type="button"><img src="p6.jpg" width="853" height="1280" loading="lazy" data-i18n-alt="ph_alt" alt=""></button>
      <button type="button"><img src="p7.jpg" width="853" height="1280" loading="lazy" data-i18n-alt="ph_alt" alt=""></button>
      <button type="button"><img src="p8.jpg" width="1280" height="853" loading="lazy" data-i18n-alt="ph_alt" alt=""></button>
    </div>
  </div>
</section>

<section id="offre">
  <div class="wrap">
    <div class="head">
      <span class="eyebrow" data-i18n="offer_eyebrow"></span>
      <h2 data-i18n="offer_title"></h2>
    </div>
    <div class="offer">
      <div class="l">
        <span class="per" data-i18n="offer_name"></span>
        <div class="price" data-count="290">290</div>
        <span class="per"><span data-i18n="cur"></span> <span data-i18n="permonth"></span></span>
        <p class="sub" data-i18n="offer_sub"></p>
      </div>
      <div class="r">
        <ul>
          <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg><span data-i18n="o1"></span></li>
          <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg><span data-i18n="o2"></span></li>
          <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg><span data-i18n="o3"></span></li>
          <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg><span data-i18n="o4"></span></li>
        </ul>
        <a class="btn btn-navy" href="inscription.html" data-go="offer" data-i18n="cta_book"></a>
        <p class="note" data-i18n="offer_note"></p>
      </div>
    </div>
  </div>
</section>

<section class="bg-paper" id="comment">
  <div class="wrap">
    <div class="head">
      <span class="eyebrow" data-i18n="how_eyebrow"></span>
      <h2 data-i18n="how_title"></h2>
    </div>
    <div class="steps">
      <div class="step"><h3 data-i18n="st1t"></h3><p data-i18n="st1p"></p></div>
      <div class="step"><h3 data-i18n="st2t"></h3><p data-i18n="st2p"></p></div>
      <div class="step"><h3 data-i18n="st3t"></h3><p data-i18n="st3p"></p></div>
    </div>
  </div>
</section>

<section id="faq">
  <div class="wrap">
    <div class="head">
      <span class="eyebrow" data-i18n="faq_eyebrow"></span>
      <h2 data-i18n="faq_title"></h2>
    </div>
    <div class="faq">
      <details open><summary data-i18n="q1"></summary><p data-i18n="a1"></p></details>
      <details><summary data-i18n="q2"></summary><p data-i18n="a2"></p></details>
      <details><summary data-i18n="q3"></summary><p data-i18n="a3"></p></details>
      <details><summary data-i18n="q4"></summary><p data-i18n="a4"></p></details>
      <details><summary data-i18n="q5"></summary><p data-i18n="a5"></p></details>
    </div>
  </div>
</section>

<section class="contact" id="contact">
  <div class="wrap">
    <div class="head">
      <span class="eyebrow" style="color:var(--gold)" data-i18n="ct_eyebrow"></span>
      <h2 data-i18n="ct_title"></h2>
      <p data-i18n="ct_sub"></p>
    </div>
    <div class="cgrid">
      <div class="ctacard">
        <h3 data-i18n="ct_cta_title"></h3>
        <p data-i18n="ct_cta_p"></p>
        <a class="btn btn-gold" href="inscription.html" data-go="contact" data-i18n="cta_book"></a>
      </div>
      <div class="info">
        <div class="ibox"><b data-i18n="i_city"></b><span data-i18n="i_city_v"></span></div>
        <div class="ibox"><b>WhatsApp</b><span id="waBox" class="muted" data-i18n="i_soon"></span></div>
        <div class="ibox"><b>Facebook</b><span id="fbBox" class="muted" data-i18n="i_fb"></span></div>
        <div class="ibox"><b data-i18n="i_pay"></b><span class="muted" data-i18n="i_pay_v"></span></div>
      </div>
    </div>
  </div>
</section>
</main>

<footer>
  <div class="wrap">
    <a class="brand" href="#top"><img src="logo.png" alt="" style="width:36px;height:36px"><span data-i18n="brand"></span></a>
    <span data-i18n="foot"></span>
  </div>
</footer>

<div id="city" class="open" role="dialog" aria-modal="true" aria-labelledby="ctitle">
  <div class="ccard">
    <div class="lang" role="group" aria-label="Langue / اللغة">
      <button type="button" data-lang="fr" aria-pressed="true">FR</button>
      <button type="button" data-lang="ar" aria-pressed="false">العربية</button>
    </div>
    <img class="clogo" src="logo.png" alt="">
    <h2 id="ctitle" data-i18n="city_title"></h2>
    <p class="csub" data-i18n="city_sub"></p>
    <div class="c4">
      <button type="button" class="ctile open" data-city="marrakech" data-open="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span class="cn" data-i18n="city_marrakech"></span><span class="cb" data-i18n="city_open"></span></button>
      <button type="button" class="ctile soon" data-city="casablanca" data-open="0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span class="cn" data-i18n="city_casablanca"></span><span class="cb" data-i18n="city_soon"></span></button>
      <button type="button" class="ctile soon" data-city="tanger" data-open="0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span class="cn" data-i18n="city_tanger"></span><span class="cb" data-i18n="city_soon"></span></button>
      <button type="button" class="ctile soon" data-city="agadir" data-open="0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span class="cn" data-i18n="city_agadir"></span><span class="cb" data-i18n="city_soon"></span></button>
    </div>
    <div class="cmsg" id="cmsg">
      <p id="cmsgt"></p>
    </div>
  </div>
</div>

<div id="lb" role="dialog" aria-modal="true" aria-hidden="true">
  <button class="x" type="button" id="lbx" aria-label="Close">×</button>
  <button class="pv" type="button" id="lbp" aria-label="Previous">‹</button>
  <img id="lbi" alt="">
  <button class="nx" type="button" id="lbn" aria-label="Next">›</button>
</div>

<div id="roll"><div id="kp" class="l"></div><div class="hop" id="hop"><button type="button" id="ballbtn" aria-label="⚽"><span class="spin" id="spin"></span></button></div></div>

<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="track.js"></script>
<script src="fx.js"></script>
